name: Backend tests and frontend build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: neotix_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-local-database
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DJANGO_DEBUG: "False"
      DB_NAME: neotix_ci
      DB_USER: postgres
      DB_PASSWORD: ci-only-local-database
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test desk --noinput
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
